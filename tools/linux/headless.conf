# headless.conf: project settings for headless_run.sh (sourced as bash).

REPO="$(cd "$HERE/../.." && pwd)"

# --- the game --------------------------------------------------------------------------------
GAME=comicjumper
BUILD_DIR_DEFAULT="$REPO/out/build/linux-amd64-release"
SDK_LIB_DIR="${SDK_LIB_DIR:-$REPO/out/sdk/out/linux-amd64}"   # private SDK copy; never ../SplosionManRecomp/out/sdk
COPY_FILES=("$GAME")
COPY_ABS=("$SDK_LIB_DIR/librexruntime.so" "$SDK_LIB_DIR/librexgpu-xenos.so" "$SDK_LIB_DIR/libTracyClient.so")
# Game data (extracted XBLA package with default.xex). Never modified, only symlinked.
GAME_DATA="${GAME_DATA:-$REPO/re/game}"
ASSET_LINKS=("game=$GAME_DATA")
# Saves + shader cache live on the big disk (not the small /tmp tmpfs), one dir per display.
HL_USERDATA="${HL_USERDATA:-$REPO/out/headless/userdata-${DISPLAY_NUM:-93}}"

# Minimal config written into the run dir (exe_dir/comicjumper.toml), never the user's config.
RUN_CONFIG_NAME=comicjumper.toml
RUN_CONFIG_CONTENT="[Input]
mnk_mode = true
[UI.Window]
fullscreen = false"
LOG_GLOB='comicjumper*.log'

# --- safety (always on the command line) -----------------------------------------------------
# input_backend=none: no SDL gamepad driver at all (MnK keyboard pad still works).
# user_data_root / cache_root: private, so the user's saves and shader cache are untouched.
SAFETY_FLAGS=(--audio_mute=true --input_backend=none --fullscreen=false
              --game_data_root=game --user_data_root=$HL_USERDATA --cache_root=$HL_USERDATA/cache
              --log_file=comicjumper_headless.log
              --gpu_plugin=xenos --mnk_mode=true)
PAD_IGNORE="0x20d6/0x2062"                   # the user's PowerA Xbox Series X wired pad
GRAPHICS=vulkan
EXTRA_ENV=()

# --- detection -------------------------------------------------------------------------------
CRASH_RE='Unhandled guest access violation|Unhandled guest physical write fault|FATAL|Segmentation fault|Bus error|terminate called'
PAD_RE='OnControllerDeviceAdded'
GDB_BREAK=""
GDB_PASS_SIGNALS=(SIGSEGV SIGBUS SIGUSR1 SIGUSR2 SIGPIPE SIGILL)

# --- driving ---------------------------------------------------------------------------------
# MnK pad: Return = Start, Space = A.
DEFAULT_KEYS=(25:Return 35:Return 45:Return)   # intro movie -> title (Press START ~25s) -> comic intro -> 3D cutscene
DISPLAY_NUM_DEFAULT=93
SCREEN=1920x1080x24
SHOT_SIZE=${SHOT_SIZE:-640x360}
MAX_GAMES=2

# Reaching level 1 gameplay (bank brawl), ~215 s: the intro can't be skipped wholesale
# (Back skips one line). Key script that gets there and fights:
#   K="25:Return 35:Return 45:Return"; for t in $(seq 55 4 199); do [ $((t%8)) -eq 3 ] && K="$K $t:Tab" || K="$K $t:space"; done
#   K="$K 216:d*3 221:space 223:d*2.5 228:a*2 232:space 235:d*4"
# MnK pad: Return/X=Start, Tab/Z=Back, Space=A, Backspace=B, L=X, P=Y, WASD=left stick.
# Trial check: EXTRA="--license_mask=2" -> pause menu shows "UNLOCK FULL GAME".
