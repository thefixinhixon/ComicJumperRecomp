# sub_825A0D10: unbounded byte-indexed jump table (lbzx from 0x82078780, base 0x825A0D58, index r11).
# Auto-detection guessed 513 entries and swallowed the next function. The real table is 13 entries
# plus 3 zero pad bytes (0x82078780..8F); the next table starts at 0x82078790.
# Entry 4 points at 0x825A0E60 (next function's prologue) -- identical in 'Splosion Man
# (sub_825CAB88 case 4 -> sub_825CACD8), where codegen emitted it as a tail call.
[[switch_tables]]
