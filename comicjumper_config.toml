# Streaming thread (loop in sub_821C48C8): WaitForMultipleObjects on 4 events; event 2 is a
# manual-reset "paused" flag the game leaves set, so the loop acks (SetEvent +36) ~7000x/s.
# Throttle the steady spin; the first acks of a burst stay immediate. See src/hooks.cpp.
[[midasm_hook]]
address = 0x821C4A54
name = "CjStreamingAckThrottle"
