# Codegen speed options (2026-11-10). skip_msr: every mtmsrd r13 region in this game (479) only
# wraps a lwarx/stwcx. pair, so the emulated "interrupts off" global mutex adds nothing but
# contention (job-queue counter sub_821BD500 between Main and the Work threads). The *_as_local
# options keep those PPC registers in host locals. skip_lr / non_volatile_as_local stay off:
# Lua error handling uses setjmp/longjmp.
skip_msr = true
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false

